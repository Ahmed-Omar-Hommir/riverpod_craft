name: craft_runner
description: Code generation runner for riverpod_craft. Watch mode, single file generation, and cleanup.
version: 0.1.0
homepage: https://github.com/Ahmed-Omar-Hommir/riverpod_craft
repository: https://github.com/Ahmed-Omar-Hommir/riverpod_craft
issue_tracker: https://github.com/Ahmed-Omar-Hommir/riverpod_craft/issues

environment:
  sdk: ^3.8.1

dependencies:
  path: ^1.9.1
  dart_style: ^3.1.1
  pub_semver: ^2.2.0
  analyzer: ^8.1.1
  crypto: ^3.0.6
  yaml: ^3.1.3
  riverpod_craft_plugin:
    path: ../riverpod_craft_plugin

dev_dependencies:
  lints: ^5.0.0
  test: ^1.24.0

executables:
  craft_runner: craft_runner
