name: riverpod_craft_plugin
description: Riverpod code generator plus the plugin interface and data models for riverpod_craft code generation plugins.
version: 0.8.0
homepage: https://github.com/Ahmed-Omar-Hommir/riverpod_craft
repository: https://github.com/Ahmed-Omar-Hommir/riverpod_craft

environment:
  sdk: ^3.5.0

dependencies:
  # Same range build_runner and build declare. The AST redesign (namePart,
  # NamedArgument, flat FormalParameter) landed in 13, so this whole range is
  # one API; 13.3.x is what a project with freezed 4.0.0-dev will resolve.
  analyzer: ">=13.3.0 <15.0.0"
  craft_runner: ^0.9.0
  dart_style: ^3.1.11
  path: ^1.9.1
  yaml: ^3.1.3

dev_dependencies:
  lints: ^5.0.0
  test: ^1.24.0

dependency_overrides:
  craft_runner:
    path: ../craft_runner
