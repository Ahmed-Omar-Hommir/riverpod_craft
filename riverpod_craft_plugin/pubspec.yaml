name: riverpod_craft_plugin
description: Riverpod code generator plus the plugin interface and data models for riverpod_craft code generation plugins.
version: 0.8.0
homepage: https://github.com/Ahmed-Omar-Hommir/riverpod_craft
repository: https://github.com/Ahmed-Omar-Hommir/riverpod_craft

environment:
  sdk: ^3.5.0

dependencies:
  analyzer: ^8.1.1
  path: ^1.9.1
  yaml: ^3.1.3
  # The project-wide plugin interface (ProjectWideCraftPlugin) now lives in
  # craft_runner. Hosted constraint for the publish artifact; local dev uses the
  # override below.
  craft_runner: ^0.7.0

dev_dependencies:
  lints: ^5.0.0
  test: ^1.24.0

# Local monorepo dev — stripped at `dart pub publish`.
dependency_overrides:
  craft_runner:
    path: ../craft_runner
