name: movies_app
description: Medium example app demonstrating all riverpod_craft provider types with TMDB API.
publish_to: "none"

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.1.0
  dio: ^5.8.0
  shared_preferences: ^2.3.0
  riverpod: ^3.1.0
  riverpod_craft:
    path: ../../riverpod_craft

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  craft_runner:
    path: ../../craft_runner
  riverpod_craft_plugin:
    path: ../../riverpod_craft_plugin


flutter:
  uses-material-design: true

# Local monorepo dev: unify the cross-referenced toolkit packages to the in-repo
# paths (they declare hosted constraints on each other).
dependency_overrides:
  craft_runner:
    path: ../../craft_runner
  riverpod_craft_plugin:
    path: ../../riverpod_craft_plugin
  riverpod_craft:
    path: ../../riverpod_craft
