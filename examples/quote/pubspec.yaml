name: quote
description: Quote example app demonstrating future provider and @command in riverpod_craft.
publish_to: "none"

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.1.0
  riverpod: ^3.1.0
  riverpod_craft:
    path: ../../riverpod_craft

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  craft_runner:
    path: ../../craft_runner

flutter:
  uses-material-design: true
