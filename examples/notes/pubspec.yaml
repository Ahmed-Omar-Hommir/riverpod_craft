name: notes
description: Notes example app demonstrating riverpod_craft usage.
publish_to: "none"

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.1.0
  http: ^1.6.0
  riverpod: ^3.1.0
  riverpod_craft:
    path: ../../riverpod_craft

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  craft_runner:
    path: ../../craft_runner

# craft_runner (path) depends on the in-repo riverpod_craft_plugin, but its own
# overrides don't propagate to this root package — pin it here so `sourceRoots`
# resolves. Local dev only.
dependency_overrides:
  riverpod_craft_plugin:
    path: ../../riverpod_craft_plugin

flutter:
  uses-material-design: true
