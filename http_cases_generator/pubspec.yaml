name: http_cases_generator
description: Craft Runner generator for strongly typed, grouped HTTP test-case catalogs.
version: 0.1.0
homepage: https://github.com/Ahmed-Omar-Hommir/riverpod_craft
repository: https://github.com/Ahmed-Omar-Hommir/riverpod_craft
issue_tracker: https://github.com/Ahmed-Omar-Hommir/riverpod_craft/issues

environment:
  sdk: ^3.5.0

dependencies:
  analyzer: ">=13.3.0 <15.0.0"
  craft_runner: ^0.11.0
  dart_style: ^3.1.11
  path: ^1.9.1

dev_dependencies:
  http_cases:
    path: ../http_cases
  lints: ^5.0.0
  test: ^1.24.0

dependency_overrides:
  craft_runner:
    path: ../craft_runner
