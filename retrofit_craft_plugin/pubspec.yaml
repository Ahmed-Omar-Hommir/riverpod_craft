name: retrofit_craft_plugin
description: craft_runner plugin that generates a grouped, versioned retrofit API client aggregator.
version: 0.8.0
homepage: https://github.com/Ahmed-Omar-Hommir/riverpod_craft
repository: https://github.com/Ahmed-Omar-Hommir/riverpod_craft
issue_tracker: https://github.com/Ahmed-Omar-Hommir/riverpod_craft/issues

environment:
  sdk: ^3.5.0

dependencies:
  analyzer: ^8.1.1
  path: ^1.9.1
  yaml: ^3.1.3
  # The ProjectWideCraftPlugin interface lives in craft_runner. Hosted
  # constraint for publish; local dev uses the override below.
  craft_runner: ^0.7.0

dev_dependencies:
  lints: ^5.0.0
  test: ^1.24.0

# Local dev overrides — stripped at `dart pub publish`.
dependency_overrides:
  craft_runner:
    path: ../craft_runner
